kind = "web"
previewPath = "/"
title = "Book Tracker"
version = "1.0.0"
id = "artifacts/book-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24596

[services.development]
run = "pnpm --filter @workspace/book-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/book-tracker", "run", "build" ]
publicDir = "artifacts/book-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24596"
BASE_PATH = "/"
